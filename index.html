<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anfrage Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background: #f5f5f5;
    }

    .form-box {
      background: #fff;
      padding: 1.5rem;
      border-radius: 8px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    .radio-group {
      display: flex;
      gap: 1.5rem; /* controls spacing between radio options */
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 0.3rem; /* space between circle and text */
      cursor: pointer;
    }

    input[type="radio"] {
      accent-color: #133665; /* theme color */
    }

    @media (max-width: 500px) {
      .radio-group {
        flex-direction: column;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>Anfrage</h2>
    <div class="form-group">
      <label>Art der Anfrage *</label>
      <div class="radio-group">
        <label><input type="radio" name="type" value="unternehmen" checked> Unternehmen</label>
        <label><input type="radio" name="type" value="privat"> Privat</label>
      </div>
    </div>
  </div>
</body>
</html>
